services:
  postgres:
    image: postgres:16-alpine
    container_name: aro-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_resource_orchestrator}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_resource_orchestrator}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        # Optional Maven mirror for restricted networks (empty = Maven Central) / 受限网络下的 Maven 镜像，留空走中央仓库
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    container_name: aro-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ai_resource_orchestrator}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD (at least 12 characters) in .env}
      AI_MODE: ${AI_MODE:-off}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      AI_AUDIT_RETENTION_DAYS: ${AI_AUDIT_RETENTION_DAYS:-90}
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-none}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      NOTIFY_MODE: ${NOTIFY_MODE:-off}
      NOTIFY_PROVIDER: ${NOTIFY_PROVIDER:-generic}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      REPLAN_AUTO_TRIGGER: ${REPLAN_AUTO_TRIGGER:-off}
      REPLAN_COOLDOWN_MINUTES: ${REPLAN_COOLDOWN_MINUTES:-30}
      SKILL_SEMANTIC_ENABLED: ${SKILL_SEMANTIC_ENABLED:-false}
      SKILL_SEMANTIC_MODE: ${SKILL_SEMANTIC_MODE:-local}
      SKILL_SEMANTIC_DIM: ${SKILL_SEMANTIC_DIM:-256}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-none}
      SYNC_JIRA_ENABLED: ${SYNC_JIRA_ENABLED:-false}
      SYNC_JIRA_BASE_URL: ${SYNC_JIRA_BASE_URL:-}
      SYNC_JIRA_USERNAME: ${SYNC_JIRA_USERNAME:-}
      SYNC_JIRA_API_TOKEN: ${SYNC_JIRA_API_TOKEN:-}
      SYNC_GITLAB_ENABLED: ${SYNC_GITLAB_ENABLED:-false}
      SYNC_GITLAB_BASE_URL: ${SYNC_GITLAB_BASE_URL:-}
      SYNC_GITLAB_TOKEN: ${SYNC_GITLAB_TOKEN:-}
      SYNC_GITHUB_ENABLED: ${SYNC_GITHUB_ENABLED:-false}
      SYNC_GITHUB_BASE_URL: ${SYNC_GITHUB_BASE_URL:-https://api.github.com}
      SYNC_GITHUB_TOKEN: ${SYNC_GITHUB_TOKEN:-}
      SYNC_ZENTAO_ENABLED: ${SYNC_ZENTAO_ENABLED:-false}
      SYNC_ZENTAO_BASE_URL: ${SYNC_ZENTAO_BASE_URL:-}
      SYNC_ZENTAO_TOKEN: ${SYNC_ZENTAO_TOKEN:-}
      SYNC_ZENTAO_PATH_PROJECTS: ${SYNC_ZENTAO_PATH_PROJECTS:-/api.php/v1/projects}
      SYNC_ZENTAO_PATH_TASKS: ${SYNC_ZENTAO_PATH_TASKS:-/api.php/v1/projects/{id}/tasks}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

volumes:
  postgres-data:
