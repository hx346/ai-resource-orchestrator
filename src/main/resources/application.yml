spring:
  application:
    name: ai-resource-orchestrator

  # SolverFactory is configured explicitly per request with a bounded solve duration.
  autoconfigure:
    exclude: ai.timefold.solver.spring.boot.autoconfigure.TimefoldSolverAutoConfiguration

  # 简历/文档上传解析的体积上限 / upload limits for resume parsing
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ai_resource_orchestrator}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # i18n：按 Accept-Language 切换 zh-CN / en-US 文案，默认简体中文
  messages:
    basename: messages
    encoding: UTF-8

  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:none}
      # 语义检索 live 模式需要 embeddings 提供方 / embeddings provider for live semantic mode
      embedding: ${AI_EMBEDDING_PROVIDER:none}
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      base-url: ${AI_BASE_URL:https://api.openai.com}
      api-key: ${AI_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}
          temperature: 0.2
      embedding:
        options:
          model: ${EMBEDDING_MODEL:text-embedding-3-small}

  cache:
    type: caffeine

  threads:
    virtual:
      enabled: true

server:
  port: 8080
  servlet:
    session:
      cookie:
        # 同源会话加固 / same-origin session hardening
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.company.orchestrator: info

app:
  admin-password: ${ADMIN_PASSWORD:}
  ai-mode: ${AI_MODE:off}
  # 登录限速（内存滑动窗口，0 = 不限速）/ login throttling; 0 disables
  auth:
    login-max-failures: ${LOGIN_MAX_FAILURES:5}
    login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  # AI 审计保留：超期每日清理，0 = 永久保留 / audit retention purge; 0 keeps everything
  ai-audit:
    retention-days: ${AI_AUDIT_RETENTION_DAYS:90}
    purge-cron: "0 30 3 * * *"
  # 出站通知：off 关闭；live 需要 NOTIFY_WEBHOOK_URL / outbound webhook notifications
  notify:
    mode: ${NOTIFY_MODE:off}
    provider: ${NOTIFY_PROVIDER:generic}
    webhook-url: ${NOTIFY_WEBHOOK_URL:}
  # 事件自动触发重规划（Phase 4）：off 关闭 / detect 仅提醒 / auto 额外生成重规划草稿（仍须人工确认）
  # event-driven replanning: off | detect (notify only) | auto (also draft a replan)
  replan:
    auto-trigger: ${REPLAN_AUTO_TRIGGER:off}
    cooldown-minutes: ${REPLAN_COOLDOWN_MINUTES:30}
  # 语义技能检索（Phase 3，可选）：需要支持 pgvector 的 PostgreSQL（如 pgvector/pgvector:pg16）
  # semantic skill search (optional): requires a pgvector-enabled PostgreSQL
  skill-semantic:
    enabled: ${SKILL_SEMANTIC_ENABLED:false}
    embedding-mode: ${SKILL_SEMANTIC_MODE:local}   # local 确定性哈希 / live 走 OpenAI 兼容 /v1/embeddings
    dim: ${SKILL_SEMANTIC_DIM:256}
  # 外部项目同步（Phase 5，单向导入）/ external project sync (one-way import)
  sync:
    jira:
      enabled: ${SYNC_JIRA_ENABLED:false}
      base-url: ${SYNC_JIRA_BASE_URL:}
      username: ${SYNC_JIRA_USERNAME:}
      api-token: ${SYNC_JIRA_API_TOKEN:}
    gitlab:
      enabled: ${SYNC_GITLAB_ENABLED:false}
      base-url: ${SYNC_GITLAB_BASE_URL:}
      token: ${SYNC_GITLAB_TOKEN:}
    zentao:
      enabled: ${SYNC_ZENTAO_ENABLED:false}
      base-url: ${SYNC_ZENTAO_BASE_URL:}
      token: ${SYNC_ZENTAO_TOKEN:}
      # 不同版本禅道路径差异时覆盖 / override for ZenTao deployments with custom API paths
      path-projects: ${SYNC_ZENTAO_PATH_PROJECTS:/api.php/v1/projects}
      path-tasks: ${SYNC_ZENTAO_PATH_TASKS:/api.php/v1/projects/{id}/tasks}
    github:
      enabled: ${SYNC_GITHUB_ENABLED:false}
      base-url: ${SYNC_GITHUB_BASE_URL:https://api.github.com}
      token: ${SYNC_GITHUB_TOKEN:}
