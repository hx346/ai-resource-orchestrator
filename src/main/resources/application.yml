spring:
  application:
    name: ai-resource-orchestrator

  # Solver 域模型落地前排除 Timefold 自动装配，避免空求解配置导致启动失败；
  # solver 模块开发时移除此排除。
  # Exclude Timefold autoconfiguration until solver domain classes exist.
  autoconfigure:
    exclude: ai.timefold.solver.spring.boot.autoconfigure.TimefoldSolverAutoConfiguration

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ai_resource_orchestrator}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # i18n：按 Accept-Language 切换 zh-CN / en-US 文案，默认简体中文
  messages:
    basename: messages
    encoding: UTF-8

  ai:
    openai:
      base-url: ${AI_BASE_URL:https://api.openai.com}
      api-key: ${AI_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}
          temperature: 0.2

  cache:
    type: caffeine

  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.company.orchestrator: debug
