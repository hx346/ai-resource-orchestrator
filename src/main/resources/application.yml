spring:
  application:
    name: ai-resource-orchestrator

  # SolverFactory is configured explicitly per request with a bounded solve duration.
  autoconfigure:
    exclude: ai.timefold.solver.spring.boot.autoconfigure.TimefoldSolverAutoConfiguration

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ai_resource_orchestrator}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # i18n：按 Accept-Language 切换 zh-CN / en-US 文案，默认简体中文
  messages:
    basename: messages
    encoding: UTF-8

  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:none}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      base-url: ${AI_BASE_URL:https://api.openai.com}
      api-key: ${AI_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}
          temperature: 0.2

  cache:
    type: caffeine

  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.company.orchestrator: info

app:
  admin-password: ${ADMIN_PASSWORD:}
  ai-mode: ${AI_MODE:off}
